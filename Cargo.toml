[workspace]
members = ["apps/desktop/src-tauri", "crates/relay-core", "crates/relay-protocol"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.90"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
opt-level = "s"
lto = "thin"
strip = true
